[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "uap-platform"
version = "0.1.0"
description = "Target UAP platform engineering foundation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "defusedxml>=0.7,<1",
    "minio>=7.2,<8",
    "pypdf>=6,<7",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
]

[project.scripts]
uap-platform-dev = "uap_platform.devserver:main"
uap-platform-object-store-init = "uap_platform.object_store_init:main"
uap-platform-readiness = "uap_platform.readiness:main"

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
  "types-defusedxml>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uap_platform"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105"]
"alembic/versions/**" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = ["minio", "minio.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["uap_platform"]

[tool.coverage.report]
fail_under = 80
show_missing = true
