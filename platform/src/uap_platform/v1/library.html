<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UAP Internal Library</title>
<style>
:root { color-scheme: light; --ink:#17202a; --muted:#5d6875; --line:#d9dee5; --panel:#fff; --bg:#f4f6f8; --brand:#14213d; --accent:#164e83; --danger:#a11; --ok:#146c43; }
* { box-sizing:border-box }
body { font:15px system-ui,-apple-system,sans-serif; margin:0; background:var(--bg); color:var(--ink) }
header { padding:18px 24px; background:var(--brand); color:white }
header h1 { margin:0 0 4px; font-size:21px }
header p { margin:0; color:#dbe5f2; font-size:13px }
nav { display:flex; gap:8px; padding:12px 24px; background:#fff; border-bottom:1px solid var(--line) }
nav button { border:1px solid var(--line); background:#fff; color:var(--ink) }
nav button.active { border-color:var(--accent); color:var(--accent); font-weight:650 }
main { display:grid; grid-template-columns:minmax(300px,36%) 1fr; gap:16px; padding:16px; max-width:1600px; margin:auto }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; box-shadow:0 1px 4px #0001 }
.toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px }
input, select, textarea, button { font:inherit; padding:8px; border-radius:6px; border:1px solid #c7ced8 }
input, select, textarea { background:#fff; color:var(--ink) }
button { cursor:pointer; background:#f8fafc }
button.primary { background:var(--accent); border-color:var(--accent); color:white }
button.danger { color:var(--danger); border-color:#d6a3a3 }
button:disabled { cursor:not-allowed; opacity:.55 }
.item { border-top:1px solid var(--line); padding:11px 0; cursor:pointer }
.item:hover { background:#f8fafc }
.item h3 { margin:0 0 4px; font-size:15px; color:var(--accent) }
.meta, .hint { color:var(--muted); font-size:13px }
.state { display:inline-block; padding:2px 7px; border-radius:99px; background:#edf2f7; font-size:12px }
.state.ok { color:var(--ok); background:#e8f5ee }
.state.bad { color:var(--danger); background:#fbecec }
.section { border-top:1px solid var(--line); padding:14px 0 }
.section:first-child { border-top:0; padding-top:0 }
.section h2 { margin:0 0 8px; font-size:17px }
.section h3 { margin:12px 0 6px; font-size:14px }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px }
.field { display:flex; flex-direction:column; gap:4px; margin:8px 0 }
.field label { color:var(--muted); font-size:13px }
textarea { min-height:84px; resize:vertical; width:100% }
.readonly { white-space:pre-wrap; word-break:break-word; background:#f8fafc; border:1px solid var(--line); border-radius:6px; padding:10px; min-height:30px }
.card { border:1px solid var(--line); border-radius:7px; padding:10px; margin:7px 0; background:#fff }
.card.removed { opacity:.6; text-decoration:line-through }
.actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px }
.notice { border-radius:6px; padding:9px 10px; margin:8px 0; background:#eef4fb; color:#234b73 }
.notice.error { background:#fbecec; color:var(--danger) }
.notice.success { background:#e8f5ee; color:var(--ok) }
.empty { color:var(--muted); padding:22px 0; text-align:center }
.modal-backdrop { position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:16px; background:#17202a88 }
.modal { width:min(640px,100%); max-height:90vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; box-shadow:0 12px 36px #0004 }
.modal h2 { margin:0 0 10px; font-size:18px }
@media(max-width:850px) { main { grid-template-columns:1fr } nav { padding-left:16px; padding-right:16px } }
</style>
<header>
  <h1>UAP 内部资料库</h1>
  <p>RAW、AI_RESULT 与 EDITORIAL 分层展示；内部资料不会自动获得公开授权。</p>
</header>
<nav aria-label="资料库视图">
  <button id="libraryTab" class="active" type="button">Internal Library</button>
  <button id="trashTab" type="button">Recycle Bin</button>
</nav>
<main>
  <section class="panel" aria-label="文档列表">
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索标题或来源" aria-label="搜索">
      <button id="loadButton" class="primary" type="button">加载</button>
    </div>
    <div id="authNotice" class="notice">使用当前 OIDC 会话；如部署没有自动注入 Bearer 会话，可临时粘贴 OIDC access token（仅保存在内存）。</div>
    <div class="field">
      <label for="oidcToken">OIDC access token（仅本次页面会话）</label>
      <input id="oidcToken" type="password" autocomplete="off" spellcheck="false">
    </div>
    <div id="listStatus" class="hint"></div>
    <div id="list"></div>
  </section>
  <section class="panel" id="detail" aria-live="polite">
    <div class="empty">选择一条资料查看详情。</div>
  </section>
</main>
<div id="modalRoot"></div>
<script>

  }

  function renderRevisionHistory(panel) {
    const section = add(panel, 'section', ''); add(section, 'h2', 'REVISION HISTORY');
    if (!state.revisions.length) { add(section, 'div', '暂无 editorial 修订历史。', 'hint'); return; }

      if (item.reason) add(card, 'div', `reason: ${item.reason}`, 'hint');

    const content = state.historical.content || {};
    for (const [label, value] of [['标题', content.title], ['摘要', content.summary], ['Bullets', content.bullets], ['分类', content.category], ['Labels', content.labels]]) { const wrap = add(section, 'div', '', 'field'); add(wrap, 'label', label); add(wrap, 'div', Array.isArray(value) ? value.join('\n') : value || '—', 'readonly'); }
    renderEditorialCards(section, 'Claims', content.claims || []); renderEditorialCards(section, 'Entities', content.entities || []);
  }
  async function viewRevision(revisionNo) { try { state.historical = await api(`/admin/v1/documents/${state.document.document_id}/editorial/revisions/${revisionNo}`); renderDetail(); } catch (error) { showApiError(error instanceof ApiError ? error : new Error('无法读取历史修订')); } }
  async function restoreRevision(revisionNo) {
    state.modal = { kind:'confirm', title:'Restore as New Revision', message:`确认以 revision ${revisionNo} 内容创建新的当前修订？旧修订不会被修改。`, confirmLabel:'Restore', onConfirm:async () => { closeModal(); try { await api(`/admin/v1/documents/${state.document.document_id}/editorial/revisions/${revisionNo}/restore`, { method:'POST', headers:{'Content-Type':'application/json','Idempotency-Key':uuid()}, body:JSON.stringify({ expected_revision:revision(), reason:`restored from revision ${revisionNo}` }) }); setNotice(`已从 revision ${revisionNo} 创建新的 editorial revision。`, 'notice success'); await loadDetail(state.document.document_id); } catch (error) { showApiError(error instanceof ApiError ? error : new Error('恢复历史修订失败')); } } }; renderModal();
  }
  function renderAi(panel) {
    const section = add(panel, 'section', ''); add(section, 'h2', 'AI RESULTS');
    for (const task of ['classification', 'summary', 'claim_extraction', 'entity_extraction']) { const row = aiResult(task); if (!row) { add(section, 'div', `${taskNames[task]}：尚无结果`, 'hint'); continue; } const card = add(section, 'div', '', 'card'); const run = row.model_run || {}; add(card, 'h3', `${taskNames[task]} · ${row.validation_status || run.status || 'unknown'}`); add(card, 'div', `model=${run.model || '—'} · prompt=${run.prompt_version || '—'} · tokens=${run.input_tokens || 0}/${run.output_tokens || 0} · cost=${run.cost_minor_units || 0} ${run.currency || 'CNY'}`, 'meta'); add(card, 'pre', jsonText(row.result), 'readonly'); if (!isTrashed() && row.validation_status === 'valid') { const actions = add(card, 'div', '', 'actions'); if (task === 'summary') button(actions, 'Adopt AI Summary', () => adopt(task, ['summary', 'bullets'])); else if (task === 'classification') button(actions, 'Adopt AI Category / Labels', () => adopt(task, ['category', 'labels'])); else if (task === 'claim_extraction') { button(actions, 'Adopt AI Claims', () => adopt(task, ['claims'])); (row.result.claims || []).forEach((_, index) => button(actions, `Adopt claim #${index + 1}`, () => adoptCandidate(task, index))); } else { button(actions, 'Adopt AI Entities', () => adopt(task, ['entities'])); (row.result.entities || []).forEach((_, index) => button(actions, `Adopt entity #${index + 1}`, () => adoptCandidate(task, index))); } } if (!isTrashed()) button(card, `Reanalyze ${taskNames[task]}`, () => reanalyze(task)); }
  }
  function renderAudit(panel) { const section = add(panel, 'section', ''); add(section, 'h2', 'AUDIT'); if (!state.audit.length) { add(section, 'div', '暂无审计事件。', 'hint'); return; } for (const event of state.audit) { const card = add(section, 'div', '', 'card'); add(card, 'strong', event.action || '—'); add(card, 'div', `${event.occurred_at || ''} · actor=${event.actor_id || '—'} · request=${event.request_id || '—'}`, 'meta'); add(card, 'div', jsonText(event.metadata || {}), 'hint'); } }
  function parseLines(value) { return value.split(/\r?\n/).map((entry) => entry.trim()).filter(Boolean); }
  function parseJsonField(id, label) { try { const value = JSON.parse($(id).value); if (!Array.isArray(value)) throw new Error(); return value; } catch (_) { throw new Error(`${label} 必须是 JSON 数组`); } }
  function changesFromForm() { const changes = {}; if (state.changed.has('title')) changes.title = $('edit-title').value; if (state.changed.has('summary')) changes.summary = $('edit-summary').value || null; if (state.changed.has('bullets')) changes.bullets = parseLines($('edit-bullets').value); if (state.changed.has('category')) changes.category = $('edit-category').value; if (state.changed.has('labels')) changes.labels = parseLines($('edit-labels').value); if (state.changed.has('claims')) changes.claims = parseJsonField('edit-claims', 'Claims'); if (state.changed.has('entities')) changes.entities = parseJsonField('edit-entities', 'Entities'); return changes; }
  async function saveEditorial() { try { const changes = changesFromForm(); if (!Object.keys(changes).length) { state.editing = false; renderDetail(); return; } const response = await api(`/admin/v1/documents/${state.document.document_id}/editorial`, { method:'PATCH', headers:{'Content-Type':'application/json','Idempotency-Key':uuid()}, body:JSON.stringify({ document_version_id:state.document.document_version_id, expected_revision:revision(), ...changes }) }); setNotice(`已保存 editorial revision（${response.resource_id || 'ok'}）`, 'notice success'); await loadDetail(state.document.document_id); } catch (error) { if (error instanceof ApiError && error.status === 409) showApiError(error); else setNotice(error.message || '保存失败', 'notice error'); } }
  async function adopt(task, fields, valuesOverride = null, itemOrdinal = null) { try { const payload = aiPayload(task); const values = valuesOverride || {}; if (!valuesOverride) for (const field of fields) values[field] = field === 'category' ? payload.suggested_document_category : payload[field]; await api(`/admin/v1/documents/${state.document.document_id}/editorial/adopt`, { method:'POST', headers:{'Content-Type':'application/json','Idempotency-Key':uuid()}, body:JSON.stringify({ document_version_id:state.document.document_version_id, expected_revision:revision(), source_analysis_result_id:aiId(task), fields, values, ...(itemOrdinal === null ? {} : {item_ordinal:itemOrdinal}) }) }); setNotice('已显式采用 AI 建议，EDITORIAL 已生成新 revision。', 'notice success'); await loadDetail(state.document.document_id); } catch (error) { showApiError(error instanceof ApiError ? error : new Error('采用 AI 失败')); } }
  function adoptCandidate(task, index) { const field = task === 'claim_extraction' ? 'claims' : 'entities'; adopt(task, [field], null, index); }
  async function mutateEditorialItem(kind, id, operation) { try { await api(`/admin/v1/documents/${state.document.document_id}/editorial/${kind}/${id}/${operation}`, { method:'POST', headers:{'Content-Type':'application/json','Idempotency-Key':uuid()}, body:JSON.stringify({ document_version_id:state.document.document_version_id, expected_revision:revision() }) }); await loadDetail(state.document.document_id); } catch (error) { showApiError(error instanceof ApiError ? error : new Error('Editorial mutation failed')); } }
  function editEditorialItem(kind, value) { openItemModal(kind, value, false); }
  function addManualItem(kind) { openItemModal(kind, {}, true); }
  async function reanalyze(task) { state.modal = { title:`Reanalyze ${taskNames[task]}`, type:'reanalyze', value:{ reason:'manual editorial review' }, submitLabel:'Submit', onSubmit:async () => { const reason=$('modal-reason').value.trim(); if (!reason) { state.modal.error='Reason 不能为空'; renderModal(); return; } try { const result = await api(`/admin/v1/documents/${state.document.document_id}/reanalyze`, { method:'POST', headers:{'Content-Type':'application/json','Idempotency-Key':uuid()}, body:JSON.stringify({ document_version_id:state.document.document_version_id, task_type:task, reason }) }); closeModal(); setNotice(`${taskNames[task]}：Queued / Requested（${result.resource_id || result.operation || 'ok'}）`, 'notice success'); } catch (error) { state.modal.error=error.message || '重新分析请求失败'; renderModal(); } } }; renderModal(); }
  async function trashDocument() { state.modal = { kind:'confirm', title:'Move to Recycle Bin', message:'确认将资料移入回收站？RAW、AI_RESULT 和审计仍会保留。', confirmLabel:'Move to Trash', onConfirm:async () => { closeModal(); try { await api(`/admin/v1/documents/${state.document.document_id}/trash`, { method:'POST', headers:{'Content-Type':'application/json','Idempotency-Key':uuid()}, body:JSON.stringify({ expected_revision:revision(), reason:'moved from Internal Library' }) }); setNotice('资料已移入回收站。', 'notice success'); await loadList(); await loadDetail(state.document.document_id); } catch (error) { showApiError(error instanceof ApiError ? error : new Error('移入回收站失败')); } } }; renderModal(); }
  async function restoreDocument() { try { await api(`/admin/v1/documents/${state.document.document_id}/restore`, { method:'POST', headers:{'Content-Type':'application/json','Idempotency-Key':uuid()}, body:JSON.stringify({ expected_revision:revision(), reason:'restored by editorial admin' }) }); setNotice('资料已恢复到内部状态，未自动公开。', 'notice success'); await loadList(); await loadDetail(state.document.document_id); } catch (error) { showApiError(error instanceof ApiError ? error : new Error('恢复失败')); } }
  async function loadTrash() { state.view = 'trash'; $('libraryTab').classList.remove('active'); $('trashTab').classList.add('active'); $('list').replaceChildren(); $('listStatus').textContent = '加载回收站中…'; try { const data = await api('/admin/v1/documents/trash?limit=50'); renderTrash(data.items || []); $('listStatus').textContent = `${(data.items || []).length} 条回收站资料`; } catch (error) { showApiError(error instanceof ApiError ? error : new Error('无法加载回收站'), $('list')); } }
  function renderTrash(items) { const list = $('list'); list.replaceChildren(); if (!items.length) { add(list, 'div', '回收站为空。', 'empty'); return; } for (const item of items) { const row = add(list, 'article', '', 'item'); add(row, 'h3', item.title || '未命名资料'); add(row, 'div', `${item.source && (item.source.name || item.source.slug) || '未知来源'} · trashed_at=${item.trashed_at || '—'} · revision=${item.revision_no || 0}`, 'meta'); row.addEventListener('click', () => loadDetail(item.document_id)); } }
  $('loadButton').addEventListener('click', () => { state.view = 'library'; $('libraryTab').classList.add('active'); $('trashTab').classList.remove('active'); loadList(); }); $('search').addEventListener('keydown', (event) => { if (event.key === 'Enter') $('loadButton').click(); }); $('trashTab').addEventListener('click', loadTrash); $('libraryTab').addEventListener('click', () => $('loadButton').click()); $('oidcToken').addEventListener('input', (event) => { state.token = event.target.value.trim(); }); loadList();
})();
</script>
</html>
