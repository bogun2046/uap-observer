[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uap-observer"
version = "0.1.0"
description = "A source-first public UAP information database and publishing pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "UAP Observer contributors" }
]
dependencies = [
  "openai==2.46.0",
  "pydantic>=2.8,<3",
  "trafilatura==1.12.2",
  "urllib3>=1.26,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
uap-observer = "uap_observer.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
