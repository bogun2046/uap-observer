name: Daily UAP Observer

on:
  push:
    branches:
      - main
  schedule:
    # 01:15 UTC = 09:15 Asia/Shanghai.
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uap-observer-daily
  cancel-in-progress: false

jobs:
  collect-analyze-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UAP_DB_PATH: data/uap.db
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openai' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'low' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install ".[dev]"

      - name: Run regression tests
        run: python -m pytest -vv --tb=short

      - name: Initialize database
        run: uap-observer init-db

      - name: Synchronize sources
        run: uap-observer sync-sources

      - name: Collect RSS feeds
        run: uap-observer collect-rss --limit 30

      - name: Collect X posts
        if: ${{ env.X_API_BEARER_TOKEN != '' }}
        continue-on-error: true
        run: uap-observer collect-x --limit 30

      - name: Collect official web release pages
        continue-on-error: true
        run: uap-observer collect-web --source aaro-press-products --limit 20

      - name: Collect official case resolutions
        continue-on-error: true
        run: uap-observer collect-web --source aaro-case-resolutions --limit 20

      - name: Record source health
        if: ${{ always() }}
        run: uap-observer source-status

      - name: Extract article text
        continue-on-error: true
        run: uap-observer extract-articles --limit 100 --retry-failed

      - name: Analyze articles
        if: ${{ (env.AI_PROVIDER == 'deepseek' && env.DEEPSEEK_API_KEY != '') || (env.AI_PROVIDER != 'deepseek' && env.OPENAI_API_KEY != '') }}
        run: uap-observer analyze-articles --limit 100 --retry-failed

      - name: Explain skipped AI step
        if: ${{ !((env.AI_PROVIDER == 'deepseek' && env.DEEPSEEK_API_KEY != '') || (env.AI_PROVIDER != 'deepseek' && env.OPENAI_API_KEY != '')) }}
        run: echo "No API key is configured for ${AI_PROVIDER}; leaving extracted articles queued for a later run."

      - name: Link analyzed entities
        run: uap-observer link-entities --limit 1000

      - name: Generate Markdown site
        run: uap-observer publish-markdown --output site/generated

      - name: Verify generated site
        run: |
          test -f site/generated/index.md
          test -f site/generated/news/index.md
          test -f site/generated/search.md
          test -f site/generated/search.json
          test -f site/generated/events/index.md
          test -f site/generated/timeline.md
          test -f site/generated/relationships.md
          python -m json.tool site/generated/search.json >/dev/null

      - name: Build HTML site
        uses: actions/jekyll-build-pages@v1
        with:
          source: site/generated
          destination: site/_site

      - name: Verify HTML site
        run: |
          test -f site/_site/index.html
          test -f site/_site/search.html
          test -f site/_site/search.json
          test -f site/_site/news/index.html

      - name: Verify pipeline health
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sqlite3
          from pathlib import Path

          database = sqlite3.connect(os.environ["UAP_DB_PATH"])
          completed_extraction = database.execute(
              "SELECT COUNT(*) FROM news WHERE extraction_status = 'completed'"
          ).fetchone()[0]
          completed_analysis = database.execute(
              "SELECT COUNT(*) FROM news WHERE processing_status = 'completed'"
          ).fetchone()[0]
          failed_extraction = database.execute(
              "SELECT COUNT(*) FROM news WHERE extraction_status = 'failed'"
          ).fetchone()[0]
          blocked_extraction = database.execute(
              """
              SELECT COUNT(*) FROM news
              WHERE extraction_status = 'failed'
                AND extraction_error LIKE '%403%'
              """
          ).fetchone()[0]
          failed_analysis = database.execute(
              "SELECT COUNT(*) FROM news WHERE processing_status = 'failed'"
          ).fetchone()[0]
          if completed_extraction == 0 or completed_analysis == 0:
              raise SystemExit(
                  "Pipeline health check failed: no completed extraction or AI analysis"
              )

          search_index = json.loads(Path("site/generated/search.json").read_text())
          missing_pages = [
              item["url"]
              for item in search_index
              if not (Path("site/_site") / item["url"]).exists()
          ]
          if missing_pages:
              raise SystemExit(f"Pipeline health check failed; missing pages: {missing_pages}")

          untranslated_titles = [
              item["title"]
              for item in search_index
              if item.get("title")
              and re.search(r"[A-Za-z]", item["title"])
              and not re.search(r"[\u4e00-\u9fff]", item["title"])
          ]
          if untranslated_titles:
              raise SystemExit(
                  "Pipeline health check failed; untranslated titles: "
                  f"{untranslated_titles}"
              )
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              Path(summary_path).write_text(
                  "## UAP Observer pipeline health\n\n"
                  f"- Extraction completed: **{completed_extraction}**\n"
                  f"- AI analysis completed: **{completed_analysis}**\n"
                  f"- Extraction failed: **{failed_extraction}**\n"
                  f"- Extraction blocked by source (403): **{blocked_extraction}**\n"
                  f"- AI analysis failed: **{failed_analysis}**\n"
                  f"- Published pages: **{len(search_index)}**\n",
                  encoding="utf-8",
              )
          print(
              "Pipeline health OK; "
              f"extraction_completed={completed_extraction} "
              f"analysis_completed={completed_analysis} "
              f"extraction_failed={failed_extraction} "
              f"extraction_blocked_403={blocked_extraction} "
              f"analysis_failed={failed_analysis} "
              f"published_pages={len(search_index)}"
          )
          PY

      - name: Checkpoint SQLite WAL
        run: sqlite3 data/uap.db "PRAGMA wal_checkpoint(TRUNCATE);"

      - name: Persist SQLite database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/uap.db
          if git diff --cached --quiet; then
            echo "SQLite database unchanged"
          else
            git commit -m "chore: update daily UAP database"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
