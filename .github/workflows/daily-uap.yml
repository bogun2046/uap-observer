name: Daily UAP Observer

on:
  schedule:
    # 01:15 UTC = 09:15 Asia/Shanghai.
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uap-observer-daily
  cancel-in-progress: false

jobs:
  collect-analyze-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UAP_DB_PATH: data/uap.db
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
      OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'low' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install ".[dev]"

      - name: Run regression tests
        run: python -m pytest

      - name: Initialize database
        run: uap-observer init-db

      - name: Synchronize sources
        run: uap-observer sync-sources

      - name: Collect RSS feeds
        run: uap-observer collect-rss --limit 30

      - name: Collect official web release pages
        continue-on-error: true
        run: uap-observer collect-web --source aaro-press-products --limit 20

      - name: Collect official case resolutions
        continue-on-error: true
        run: uap-observer collect-web --source aaro-case-resolutions --limit 20

      - name: Extract article text
        run: uap-observer extract-articles --limit 20 --retry-failed

      - name: Analyze articles
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: uap-observer analyze-articles --limit 20 --retry-failed

      - name: Explain skipped AI step
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo "OPENAI_API_KEY is not configured; leaving extracted articles queued for a later run."

      - name: Link analyzed entities
        run: uap-observer link-entities --limit 1000

      - name: Generate Markdown site
        run: uap-observer publish-markdown --output site/generated

      - name: Checkpoint SQLite WAL
        run: sqlite3 data/uap.db "PRAGMA wal_checkpoint(TRUNCATE);"

      - name: Persist SQLite database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/uap.db
          if git diff --cached --quiet; then
            echo "SQLite database unchanged"
          else
            git commit -m "chore: update daily UAP database"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/generated

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
